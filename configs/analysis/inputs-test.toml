# Test inputs for the spec 007 analysis (format: src/analysis/inputs.py), WP-09. Every run is from
# the frozen grid on the lab RTX 5090 cbu-5090-left at commit 37c71c0, freeze content 5c5759f767c9
# (docs/wp09_single_gpu_runbook.md): TF-IDF, Qwen2.5-7B and DeBERTa-v3-large on 2026-11-19 (jobs
# 455-456); hybrid composed and scored on 2026-11-22 (job 467); DeBERTa-v3-base on 2026-11-22
# (job 468).
version = "analysis-inputs-v1"
split = "test"

[systems.tfidf-utterance]
stage1 = [
  { train_condition = "full", seed = 13, run_dir = "outputs/stage1-test/tfidf-utterance/train-full/seed13" },
]

[systems.tfidf-context]
stage1 = [
  { train_condition = "full", seed = 13, run_dir = "outputs/stage1-test/tfidf-context/train-full/seed13" },
]

[systems.deberta-v3-base]
stage1 = [
  { train_condition = "none", seed = 13, run_dir = "outputs/stage1-test/deberta-v3-base/train-none/seed13" },
  { train_condition = "none", seed = 42, run_dir = "outputs/stage1-test/deberta-v3-base/train-none/seed42" },
  { train_condition = "none", seed = 2026, run_dir = "outputs/stage1-test/deberta-v3-base/train-none/seed2026" },
  { train_condition = "none", seed = 314, run_dir = "outputs/stage1-test/deberta-v3-base/train-none/seed314" },
  { train_condition = "none", seed = 2718, run_dir = "outputs/stage1-test/deberta-v3-base/train-none/seed2718" },
  { train_condition = "one", seed = 13, run_dir = "outputs/stage1-test/deberta-v3-base/train-one/seed13" },
  { train_condition = "one", seed = 42, run_dir = "outputs/stage1-test/deberta-v3-base/train-one/seed42" },
  { train_condition = "one", seed = 2026, run_dir = "outputs/stage1-test/deberta-v3-base/train-one/seed2026" },
  { train_condition = "one", seed = 314, run_dir = "outputs/stage1-test/deberta-v3-base/train-one/seed314" },
  { train_condition = "one", seed = 2718, run_dir = "outputs/stage1-test/deberta-v3-base/train-one/seed2718" },
  { train_condition = "full", seed = 13, run_dir = "outputs/stage1-test/deberta-v3-base/train-full/seed13" },
  { train_condition = "full", seed = 42, run_dir = "outputs/stage1-test/deberta-v3-base/train-full/seed42" },
  { train_condition = "full", seed = 2026, run_dir = "outputs/stage1-test/deberta-v3-base/train-full/seed2026" },
  { train_condition = "full", seed = 314, run_dir = "outputs/stage1-test/deberta-v3-base/train-full/seed314" },
  { train_condition = "full", seed = 2718, run_dir = "outputs/stage1-test/deberta-v3-base/train-full/seed2718" },
]

[systems.deberta-v3-large]
stage1 = [
  { train_condition = "none", seed = 13, run_dir = "outputs/stage1-test/deberta-v3-large/train-none/seed13" },
  { train_condition = "none", seed = 42, run_dir = "outputs/stage1-test/deberta-v3-large/train-none/seed42" },
  { train_condition = "none", seed = 2026, run_dir = "outputs/stage1-test/deberta-v3-large/train-none/seed2026" },
  { train_condition = "none", seed = 314, run_dir = "outputs/stage1-test/deberta-v3-large/train-none/seed314" },
  { train_condition = "none", seed = 2718, run_dir = "outputs/stage1-test/deberta-v3-large/train-none/seed2718" },
  { train_condition = "one", seed = 13, run_dir = "outputs/stage1-test/deberta-v3-large/train-one/seed13" },
  { train_condition = "one", seed = 42, run_dir = "outputs/stage1-test/deberta-v3-large/train-one/seed42" },
  { train_condition = "one", seed = 2026, run_dir = "outputs/stage1-test/deberta-v3-large/train-one/seed2026" },
  { train_condition = "one", seed = 314, run_dir = "outputs/stage1-test/deberta-v3-large/train-one/seed314" },
  { train_condition = "one", seed = 2718, run_dir = "outputs/stage1-test/deberta-v3-large/train-one/seed2718" },
  { train_condition = "full", seed = 13, run_dir = "outputs/stage1-test/deberta-v3-large/train-full/seed13" },
  { train_condition = "full", seed = 42, run_dir = "outputs/stage1-test/deberta-v3-large/train-full/seed42" },
  { train_condition = "full", seed = 2026, run_dir = "outputs/stage1-test/deberta-v3-large/train-full/seed2026" },
  { train_condition = "full", seed = 314, run_dir = "outputs/stage1-test/deberta-v3-large/train-full/seed314" },
  { train_condition = "full", seed = 2718, run_dir = "outputs/stage1-test/deberta-v3-large/train-full/seed2718" },
]

[systems."qwen2.5-7b-instruct"]
stage2 = [
  { train_condition = "untrained", seed = 0, routed = "outputs/stage2/qwen2.5-7b-instruct/test/routed.jsonl", oracle = "outputs/stage2/qwen2.5-7b-instruct/test/oracle.jsonl" },
]
transfer = "outputs/stage2/metrics/qwen2.5-7b-instruct.transfer-test.json"

[systems.hybrid]
