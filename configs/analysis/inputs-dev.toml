  { train_condition = "none", seed = 42, routed = "outputs/stage2/hybrid/dev/train-none/seed42/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-none/seed42/oracle.jsonl" },
  { train_condition = "none", seed = 2026, routed = "outputs/stage2/hybrid/dev/train-none/seed2026/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-none/seed2026/oracle.jsonl" },
  { train_condition = "none", seed = 314, routed = "outputs/stage2/hybrid/dev/train-none/seed314/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-none/seed314/oracle.jsonl" },
  { train_condition = "none", seed = 2718, routed = "outputs/stage2/hybrid/dev/train-none/seed2718/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-none/seed2718/oracle.jsonl" },
  { train_condition = "one", seed = 13, routed = "outputs/stage2/hybrid/dev/train-one/seed13/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-one/seed13/oracle.jsonl" },
  { train_condition = "one", seed = 42, routed = "outputs/stage2/hybrid/dev/train-one/seed42/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-one/seed42/oracle.jsonl" },
  { train_condition = "one", seed = 2026, routed = "outputs/stage2/hybrid/dev/train-one/seed2026/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-one/seed2026/oracle.jsonl" },
  { train_condition = "one", seed = 314, routed = "outputs/stage2/hybrid/dev/train-one/seed314/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-one/seed314/oracle.jsonl" },
  { train_condition = "one", seed = 2718, routed = "outputs/stage2/hybrid/dev/train-one/seed2718/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-one/seed2718/oracle.jsonl" },
  { train_condition = "full", seed = 13, routed = "outputs/stage2/hybrid/dev/train-full/seed13/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-full/seed13/oracle.jsonl" },
  { train_condition = "full", seed = 42, routed = "outputs/stage2/hybrid/dev/train-full/seed42/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-full/seed42/oracle.jsonl" },
  { train_condition = "full", seed = 2026, routed = "outputs/stage2/hybrid/dev/train-full/seed2026/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-full/seed2026/oracle.jsonl" },
  { train_condition = "full", seed = 314, routed = "outputs/stage2/hybrid/dev/train-full/seed314/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-full/seed314/oracle.jsonl" },
  { train_condition = "full", seed = 2718, routed = "outputs/stage2/hybrid/dev/train-full/seed2718/routed.jsonl", oracle = "outputs/stage2/hybrid/dev/train-full/seed2718/oracle.jsonl" },
