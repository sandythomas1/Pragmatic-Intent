# TF-IDF + logistic regression with separate utterance and context vocabularies.
# Override the training context with --train-condition {one,full,mismatched,mismatched_one}.
[run]
name = "tfidf-context"
kind = "tfidf"

[data]
train_condition = "full"

[tfidf]
use_context = true
ngram_max = 2
min_df = 2
c = 1.0
