# Manifest of third-party source datasets for the Pragmatic Intent benchmark.
#
# Consumed by `python -m src.data.download_sources` (see docs/data_sources.md).
# Files are written to data/raw/<name>/<path>, which is git-ignored: the sources
# carry their own licenses and must not be redistributed through this repo.
#
# Every URL must be https:// on a host listed in `allowed_hosts`; redirects are
# held to the same rule. URLs are pinned to a commit or a release so the SHA-256
# checksums stay valid. To add or bump a source: download the file once, record
# its size and `sha256sum`, and document its license in docs/data_sources.md.
#
# Schema (validated by the downloader; unknown keys are rejected):
#   [[sources]]        name, title, homepage, license, license_url,
#                      citation_key, version, files, [intended_use], [notes]
#   [[sources.files]]  url, path, sha256, size, [extract], [keep_archive]
#   extract entries    member, sha256, size  (only these members are extracted)

schema_version = 1

allowed_hosts = [
  "raw.githubusercontent.com",
  "huggingface.co",
  "amazon-massive-nlu-dataset.s3.amazonaws.com",
  "ndownloader.figshare.com",
  # Figshare's download host 302-redirects to its path-style S3 bucket
  # (/pfigshare-u-files/...). The regional host admits any bucket, which is
  # acceptable only because every file is pinned by size and SHA-256.
  "s3-eu-west-1.amazonaws.com",
  # Project Gutenberg serves /cache/epub/<n>/pg<n>.txt directly (no redirect). Gutenberg
  # regenerates files occasionally; a changed upstream file fails the pin by design
  # (see "Literary editions" in docs/data_sources.md for the re-pin policy).
  "www.gutenberg.org",
]

