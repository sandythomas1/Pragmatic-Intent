[project]
name = "pragmatic-intent"
version = "0.1.0"
description = "Pragmatic intent detection: conversational context x linguistic indirectness"
readme = "README.md"
license = "MIT"
# The data pipeline, annotation tools and scorers use only the standard library.
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
classical = [
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
]
# torch 2.11 + CUDA 12.8: has sm_120 kernels for the RTX 5060 and runs on the RTX 4090.
# CUDA 12.8 wheels need NVIDIA driver 570+ (on WSL, the Windows driver).
gpu = [
    { include-group = "classical" },
    "torch==2.11.0",
    "transformers==4.57.6",
    "sentencepiece==0.2.2",  # DeBERTa-v3 tokenizer
    "protobuf==5.29.6",      # slow-to-fast tokenizer conversion
]
# Only the spec 007 figure script (src/analysis/figures.py); the analysis itself is stdlib-only.
figures = [
    "matplotlib==3.10.9",
]
# Spec 009 local LLM interpreter (src/llm/backends/vllm_backend.py). Linux/WSL only: vLLM has no
# Windows wheels, so on Windows this group installs nothing. vLLM 0.32.0 pins its own torch
# (2.13.0, from PyPI) and, through numba, numpy < 2.5, so it gets its own environment: it conflicts
# with the gpu group (torch 2.11) and the classical group (numpy 2.5.3).
llm = [
    "vllm==0.32.0; sys_platform == 'linux'",
]

[tool.uv]
package = false
conflicts = [
    [{ group = "gpu" }, { group = "llm" }],
    [{ group = "classical" }, { group = "llm" }],
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'", group = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
